# kitty.conf
# mappings.conf
#
# Author: Wojciech 'KosciaK' Pietrzok
#
#
# Reference: https://sw.kovidgoyal.net/kitty/mapping/
# Reference: https://sw.kovidgoyal.net/kitty/actions/
#
# You can combine multiple actions:
# map combine : action : action
#
# You can use multiple keys mappings:
# map key1>key2>key3 action
#
# To unmap defaults, map keys to nothing
#
# TODO: https://sw.kovidgoyal.net/kitty/mapping/#modal-mappings
#


# Default, but let's keep it here for clarity
# NOTE: Declare ctrl+shift+alt explicitely!
kitty_mod                   ctrl+shift


# ----------------------------------------------------------------------
# Keyboard
# ----------------------------------------------------------------------

# Unbind defaults
map     kitty_mod+g
#                           show_last_command_output
map     kitty_mod+h
#                           show_scrollback
map     kitty_mod+z
#                           scroll_to_prompt -1
map     kitty_mod+x
#                           scroll_to_prompt  1
map     kitty_mod+q
#                           close_tab 
#                           # NOTE: There's no *_with_confirmation
map     kitty_mod+Left
#                           previous_tab
map     kitty_mod+Right
#                           next_tab
map     kitty_mod+[
#                           previous_window
map     kitty_mod+]
#                           next_window
map     kitty_mod+f
#                           move_window_forward
map     kitty_mod+b
#                           move_window_backward
map     kitty_mod+`
#                           move_window_to_top
map     kitty_mod+l
#                           next_layout


# Ctrl+Insert, Shift+Insert for Copy/Paste
map     ctrl+insert         copy_to_clipboard
map     shift+insert        paste_from_selection
map     ctrl+shift+insert   paste_from_clipboard


# Scroll with Shift instead of Ctrl+Shift
map     shift+page_up       scroll_page_up
map     shift+page_down     scroll_page_down
# NOTE: Not sure if it won't break anything
map     shift+up            scroll_line_up
map     shift+down          scroll_line_down


# Scrollback and command history
map     kitty_mod+,         scroll_to_prompt -1
map     kitty_mod+.         scroll_to_prompt  1
map     kitty_mod+/         show_scrollback


# New windows / tabs always with current working dir
map     kitty_mod+enter     new_window_with_cwd
map     ctrl+shift+alt+enter new_os_window
map     kitty_mod+t         new_tab_with_cwd !neighbor
map     ctrl+shift+alt+t    new_tab


# Always ask for confirmation before closing!
map     kitty_mod+w         close_window_with_confirmation


# Detach window or tab
map     kitty_mod+m         detach_window ask
map     ctrl+shift+alt+m    detach_tab ask


# Set tab title
map     kitty_mod+a         set_tab_title


# Ctrl+Page<Up/Down> to change tabs
map     ctrl+page_up        previous_tab
map     ctrl+page_down      next_tab
map     kitty_mod+p         previous_tab
map     kitty_mod+n         next_tab

# Ctrl+Shift+Page<Up/Down> to move tabs
map     kitty_mod+page_down move_tab_forward
map     kitty_mod+page_up   move_tab_backward
map     ctrl+shift+alt+p    move_tab_backward
map     ctrl+shift+alt+n    move_tab_forward

# Switch to tabs by number (like windows in tmux/screen)
map     kitty_mod+1         goto_tab 1
map     kitty_mod+2         goto_tab 2
map     kitty_mod+3         goto_tab 3
map     kitty_mod+4         goto_tab 4
map     kitty_mod+5         goto_tab 5
map     kitty_mod+6         goto_tab 6
map     kitty_mod+7         goto_tab 7
map     kitty_mod+8         goto_tab 8
map     kitty_mod+9         goto_tab 9
map     kitty_mod+0         goto_tab 10


# Switch windows
map     kitty_mod+j         next_window
map     kitty_mod+k         previous_window
map     kitty_mod+;         nth_window -1
map     kitty_mod+i         first_window


# Move windows
map     ctrl+shift+alt+j     move_window_forward
map     ctrl+shift+alt+k     move_window_backward
map     ctrl+shift+alt+i     move_window_to_top


# Next/previous layout
map     kitty_mod+\         next_layout
map     ctrl+shift+alt+\    next_layout -1

# Resize main/first window
map     kitty_mod+]         layout_action bias 75
map     kitty_mod+[         layout_action bias 50
map     ctrl+shift+alt+]    layout_action bias 50 62 75 88
map     ctrl+shift+alt+[    layout_action bias 88 75 62 50

# Toogle Stack layout (full window)
map     kitty_mod+z         toggle_layout stack

# Mirror Tall / Fat layout
# map     kitty_mod+\         layout_action mirror toggle
# map     ctrl+shift+alt+\    layout_action mirror toggle


# ----------------------------------------------------------------------
# Mouse
# ----------------------------------------------------------------------

# mouse_map ctrl+shift+left release ungrabbed
# mouse_map ctrl+shift+left press ungrabbed

# Rectangular selection with Ctrl[+Shift][+Alt]-LeftClick
mouse_map ctrl+left         press ungrabbed mouse_selection rectangle
mouse_map ctrl+alt+left     press ungrabbed mouse_selection rectangle
mouse_map ctrl+shift+left   press ungrabbed mouse_selection rectangle
mouse_map ctrl+shift+alt+left press ungrabbed mouse_selection rectangle
# NOTE: For some unknown reason Ctrl-Shift alone still don't work in VIM
#       You have to use Ctrl-Shift-Alt

# Open URLs with shift+Right click instead of just left click
# NOTE: This will disable moving cursor in current shell by clicking!
mouse_map left              click ungrabbed no-op
mouse_map shift+right       click ungrabbed mouse_handle_click selection link prompt

