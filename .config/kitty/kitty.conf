# kitty.conf
#
# Author: Wojciech 'KosciaK' Pietrzok
#
# Reference: https://sw.kovidgoyal.net/kitty/conf/
#
# NOTE: To reload config: Ctrl-Shift-F5
#

# ----------------------------------------------------------------------
# Window layout
# ----------------------------------------------------------------------

remember_window_size        no
initial_window_width        80c
initial_window_height       24c

# NOTE: Removing window decorations makes it harder
#       to move and resize window
# hide_window_decorations     yes
hide_window_decorations     no


# Draw borders only between windows if needed
draw_minimal_borders        yes

# NOTE: Not yet available in 0.43
draw_window_borders_for_single_window yes

window_border_width         1px

window_margin_width         0
window_padding_width        1   2

placement_strategy          center

enabled_layouts             fat, tall, stack


# ----------------------------------------------------------------------
# Fonts
# ----------------------------------------------------------------------

# Selected font
include fonts/dejavu_sans_mono.conf
# include fonts/adwaita_mono.conf

# Explicitely map Nerd Fonts
# kitty supposedly comes bundled with NF fallback symbols built-in
# but not all characters are displayed correctly, maybe it's older version
include fonts/symbols_nerd_font.conf

font_size                   11.0

# NOTE: There ara some slight differences in kitty font rendering
#       Mostly in slight colour differences, not sure why
# text_composition_strategy   platform
# text_composition_strategy   legacy
text_composition_strategy   1.75     0.0

# narrow_symbols U+E000-U+F8FF,U+F0000-U+FFFFF,U+100000-U+10ffff 1


# ----------------------------------------------------------------------
# Colors and theme
# ----------------------------------------------------------------------

include themes/tango_light.conf

# Make selection reverse colors
selection_background        none
selection_foreground        none

# NOTE: must be specified explicitely
url_style                   straight


# ----------------------------------------------------------------------
# Cursor
# ----------------------------------------------------------------------

# Set to none to reverse colors instead of solid color
cursor                      none

cursor_shape                block
cursor_shape_unfocused      hollow

cursor_beam_thickness       1
cursor_underline_thickness  1.5

# shell integration sets cursor to beam, to avoid it:
shell_integration   no-cursor

# Use system default for blinking
cursor_blink_interval       -1
cursor_stop_blinking_after  10.0

cursor_trail    0


# ----------------------------------------------------------------------
# Scrolling
# ----------------------------------------------------------------------

scrollback_lines            20000

scrollbar                   always

scrollbar_interactive       yes
scrollbar_jump_on_click     yes

scrollbar_width             0.5
scrollbar_hover_width       1.25
scrollbar_radius            0.75
scrollbar_gap               0.25

scrollbar_handle_opacity        0.5
scrollbar_track_opacity         0.1
scrollbar_track_hover_opacity   0.15

scrollbar_hitbox_expansion      2.0

scrollback_fill_enlarged_window yes


# ----------------------------------------------------------------------
# Mouse
# ----------------------------------------------------------------------

# Hide mouse on typing
mouse_hide_wait             -1

show_hyperlink_targets     yes


# ----------------------------------------------------------------------
# Bell
# ----------------------------------------------------------------------

enable_audio_bell           yes
visual_bell_duration        0.0


# ----------------------------------------------------------------------
# Tab bar
# ----------------------------------------------------------------------

tab_bar_edge                top
tab_bar_align               left
tab_bar_style               powerline
tab_bar_min_tabs            2

tab_bar_margin_width        0.0
tab_bar_margin_height       0.0     0.0

tab_title_max_length        0

# tab_activity_symbol         none


# ----------------------------------------------------------------------
# Mappings
# ----------------------------------------------------------------------

include mappings.conf

