# .config/tmux/tmux.conf
#
# Author: Wojciech 'KosciaK' Pietrzok
#
# ----------------------------------------------------------------------
#   General settings
# ----------------------------------------------------------------------

# Start numbering windows and panes with 1
set -g base-index 1
set -g pane-base-index 1


# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 100

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 25000


# Update client terminal title
set -g set-titles on

# Use hostname: pane title
set -g set-titles-string "#{host_short}: #{pane_title}"


# Use vi keys in copy mode
set -g mode-keys vi


# Type of characters used for drawing pane borders
set -g pane-border-lines single  # single, double, heavy, simple, number

# Show pane status only for multiple panes
# set -g pane-border-status top
set-hook -g window-layout-changed 'set-window -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
# set -g pane-border-format "#{pane_index} #{pane_current_command}"


# ----------------------------------------------------------------------
#   Key bindings
# ----------------------------------------------------------------------

## Enable mouse support
set -g mouse on


# remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g      prefix C-a

# Pass prefix key to the window
bind a      send-prefix

# Rename window like in screen
bind A      command-prompt -I'#W' { rename-window -- '%%' }

# Switch windows with Ctrl like in screen
bind C-a    last-window
bind C-n    next-window
bind C-p    previous-window

# Switch to next/previous pane
bind j      select-pane -t :.+
bind C-j    select-pane -t :.+
bind k      select-pane -t :.-
bind C-k    select-pane -t :.-

# reload config file
bind r      source-file ~/.config/tmux/tmux.conf \; display-message 'Config reloaded!'
bind C-r    source-file ~/.config/tmux/tmux.conf \; display-message 'Config reloaded!'

# Create new windows and panes with CWD
unbind %
unbind '"'
bind c      new-window  #   -c "#{pane_current_path}"
bind C-c    new-window  #   -c "#{pane_current_path}"
bind C-v    split-window -h -c "#{pane_current_path}"
bind C-s    split-window -v -c "#{pane_current_path}"

# Show only windows from current session
bind w      run 'tmux choose-tree -Nwf"##{==:##{session_name},#{session_name}}"'


# ----------------------------------------------------------------------
#   Statusbar
# ----------------------------------------------------------------------

# Set status bar on
set -g  status on

# Set the status bar position
set -g status-position bottom # [top, bottom]

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 1

# Powerline symbols:
#       
#       
#    
# Misc symbols:
# 󰈈 󰎂 󰖯 󱀅 󰓦 󰓹    󰨤 󰃃 󰃀  󰛐 󱈸  󰝟  ⦁ 

set -g  status-left  '#{host}'
set -ga status-left  ' '

set -g  status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}'
set -ga status-right '"#{=21:pane_title}"'
set -ga status-right ' '
set -ga status-right '%H:%M'

set -g  window-status-format ''
set -ga window-status-format ' '
set -ga window-status-format '#[bold]'
# set -ga window-status-format '#{?window_zoomed_flag,󰨤 ,}'   # Z
set -ga window-status-format '#{window_index}'
# set -ga window-status-format '#{?window_flags,#{window_flags},}'
set -ga window-status-format '#{?window_activity_flag,󰓦,}'  # #
set -ga window-status-format '#{?window_silence_flag,,}'    # ~
set -ga window-status-format '#{?window_bell_flag,󱈸,}'      # !
set -ga window-status-format '#{?window_marked_flag, ,}'   # M
set -ga window-status-format '#{?window_last_flag,·,:}'     # -
# set -ga window-status-format ':'
set -ga window-status-format '#[nobold]'
set -ga window-status-format '#{window_name}'
set -ga window-status-format ' '

set -g  window-status-current-format ''
set -ga window-status-current-format '#{?client_prefix,#[bg=brightwhite],}'
set -ga window-status-current-format ''
set -ga window-status-current-format ' '
set -ga window-status-current-format '#{?window_zoomed_flag,󰨤 ,}'   # Z
set -ga window-status-current-format '#{window_index}'
# set -ga window-status-current-format '#{?window_flags,#{window_flags},}'
set -ga window-status-current-format '#{?window_active,,}'          # *
set -ga window-status-current-format '#{?window_activity_flag,󰓦,}'  # #
set -ga window-status-current-format '#{?window_silence_flag,,}'    # ~
set -ga window-status-current-format '#{?window_bell_flag,󱈸,}'      # !
set -ga window-status-current-format '#{?window_marked_flag, ,}'   # M
set -ga window-status-current-format ':'
set -ga window-status-current-format '#{window_name}'
set -ga window-status-current-format ' '
set -ga window-status-current-format ''

set -g  window-status-separator ''


# ----------------------------------------------------------------------
#   Style
# ----------------------------------------------------------------------

set -g status-style                 'bg=black,fg=brightwhite'
set -g status-left-style            'bg=black,fg=brightwhite'
set -g window-status-style          'bg=default,fg=brightwhite'
set -g window-status-current-style  'bg=white,fg=black,bold'


# ----------------------------------------------------------------------
#   Terminal
# ----------------------------------------------------------------------

## Change $TERM settings
# NOTE: After adding terminal-overrides works OK with default tmux-256color
#       And it's easier to detect we work in tmux with correct $TERM
# set -g default-terminal "${TERM}"


## Fix terminal capabilities

# enable RGB colors
# Tmux version >= 3.2
set -as terminal-features ",xterm-256color:Tc,xterm-kitty:RGB,alacritty:RGB,gnome*:RGB"
# Older versions
# set -as terminal-overrides ",xterm-256color:Tc,xterm-kitty:RGB,alacritty:RGB,gnome*:RGB"

# strikethrough
set -as terminal-overrides ',*:smxx=\E[9m'

# Cursor shapes
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Underline colors support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

